<div class="container-fluid px-0">

  <section
    class="bg-white border rounded-4 p-4 mb-4"
  >

    <span
      class="badge text-bg-primary mb-3"
    >
      Cooperativa
    </span>

    <h1 class="h3 fw-bold">
      Panel de Cooperativa
    </h1>

    <p class="text-secondary mb-0">
      Administra la operación y configuración
      de la cooperativa.
    </p>

  </section>

  <div class="row g-3">

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <div
            class="d-flex justify-content-between align-items-center mb-3"
          >

            <span class="text-secondary">
              Buses
            </span>

            <i
              class="bi bi-bus-front fs-4 text-primary"
            ></i>

          </div>

          <h2 class="fw-bold mb-1">
            -
          </h2>

          <small class="text-secondary">
            Flota registrada
          </small>

        </div>

      </div>

    </div>

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <div
            class="d-flex justify-content-between align-items-center mb-3"
          >

            <span class="text-secondary">
              Plantillas
            </span>

            <i
              class="bi bi-grid-3x3-gap fs-4 text-success"
            ></i>

          </div>

          <h2 class="fw-bold mb-1">
            -
          </h2>

          <small class="text-secondary">
            Configuraciones de buses
          </small>

        </div>

      </div>

    </div>

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <div
            class="d-flex justify-content-between align-items-center mb-3"
          >

            <span class="text-secondary">
              Rutas
            </span>

            <i
              class="bi bi-signpost-2 fs-4 text-warning"
            ></i>

          </div>

          <h2 class="fw-bold mb-1">
            -
          </h2>

          <small class="text-secondary">
            Rutas configuradas
          </small>

        </div>

      </div>

    </div>

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <div
            class="d-flex justify-content-between align-items-center mb-3"
          >

            <span class="text-secondary">
              Frecuencias
            </span>

            <i
              class="bi bi-clock fs-4 text-danger"
            ></i>

          </div>

          <h2 class="fw-bold mb-1">
            -
          </h2>

          <small class="text-secondary">
            Frecuencias disponibles
          </small>

        </div>

      </div>

    </div>

  </div>

</div>
