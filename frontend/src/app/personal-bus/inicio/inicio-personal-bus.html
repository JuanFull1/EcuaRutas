<div class="container-fluid px-0">

  <section
    class="bg-white border rounded-4 p-4 mb-4"
  >

    <span
      class="badge text-bg-warning mb-3"
    >
      Personal de Bus
    </span>

    <h1 class="h3 fw-bold">
      Operación del viaje
    </h1>

    <p class="text-secondary mb-0">
      Control y validación de los viajes
      asignados.
    </p>

  </section>

  <div class="row g-3">

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <span class="text-secondary">
            Viajes hoy
          </span>

          <i
            class="bi bi-bus-front fs-4 text-primary float-end"
          ></i>

          <h2 class="fw-bold mt-3 mb-1">
            -
          </h2>

          <small class="text-secondary">
            Viajes asignados
          </small>

        </div>

      </div>

    </div>

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <span class="text-secondary">
            Validaciones
          </span>

          <i
            class="bi bi-qr-code-scan fs-4 text-success float-end"
          ></i>

          <h2 class="fw-bold mt-3 mb-1">
            -
          </h2>

          <small class="text-secondary">
            Boletos validados
          </small>

        </div>

      </div>

    </div>

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <span class="text-secondary">
            Historial
          </span>

          <i
            class="bi bi-clock-history fs-4 text-warning float-end"
          ></i>

          <h2 class="fw-bold mt-3 mb-1">
            -
          </h2>

          <small class="text-secondary">
            Viajes anteriores
          </small>

        </div>

      </div>

    </div>

  </div>

</div>
