<section class="mapa-marco border rounded-4 overflow-hidden bg-white" [attr.aria-label]="etiqueta()" [attr.aria-busy]="cargando()">
  <div #contenedor class="mapa-contenedor"></div>
  @if (cargando()) {
    <div class="mapa-estado bg-white rounded-3 shadow-sm p-3 text-secondary" role="status">
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Cargando mapa...
    </div>
  }
  @if (error(); as mensaje) {
    <div class="mapa-estado alert alert-danger shadow-sm mb-0" role="alert">{{ mensaje }}</div>
  }
  @if (estilo() === estiloDesarrollo) {
    <footer class="mapa-creditos text-secondary small px-3 py-2">
      Cartografía:
      <a href="https://maplibre.org/" target="_blank" rel="noopener noreferrer">MapLibre</a>
      · <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener noreferrer">Natural Earth</a>
    </footer>
  }
</section>
