<div
  class="login-page d-flex align-items-center justify-content-center"
>

  <div class="container">

    <div
      class="row g-0 login-container shadow-lg mx-auto"
    >

      <div
        class="col-lg-6 d-none d-lg-flex login-brand"
      >

        <div>

          <div class="brand-icon mb-4">
            <i class="bi bi-bus-front-fill"></i>
          </div>

          <h1 class="fw-bold mb-3">
            EcuaRutas
          </h1>

          <p class="lead mb-0">
            Gestión y venta de pasajes de
            transporte interprovincial.
          </p>

        </div>

      </div>

      <div class="col-12 col-lg-6 bg-white">

        <div class="login-form">

          <div
            class="d-lg-none text-center mb-4"
          >

            <div
              class="brand-icon mobile mx-auto mb-2"
            >
              <i class="bi bi-bus-front-fill"></i>
            </div>

            <h2 class="fw-bold">
              EcuaRutas
            </h2>

          </div>

          <h2 class="fw-bold mb-2">
            Iniciar sesión
          </h2>

          <p class="text-secondary mb-4">
            Ingresa tus credenciales para continuar.
          </p>

          <div
            *ngIf="error"
            class="alert alert-danger"
            role="alert"
            aria-live="polite"
          >

            <i
              class="bi bi-exclamation-circle me-2"
            ></i>

            {{ error }}

          </div>

          <form
            [formGroup]="formulario"
            (ngSubmit)="iniciarSesion()"
          >

            <div class="mb-3">

              <label
                for="correo"
                class="form-label fw-semibold"
              >
                Correo electrónico
              </label>

              <div class="input-group">

                <span class="input-group-text">
                  <i class="bi bi-envelope"></i>
                </span>

                <input
                  id="correo"
                  type="email"
                  class="form-control"
                  formControlName="correo"
                  placeholder="usuario@ecuarutas.com"
                  autocomplete="email"
                >

              </div>

              <div
                *ngIf="
                  formulario.controls.correo.touched &&
                  formulario.controls.correo.invalid
                "
                class="text-danger small mt-1"
              >
                Ingresa un correo válido.
              </div>

            </div>

            <div class="mb-4">

              <label
                for="password"
                class="form-label fw-semibold"
              >
                Contraseña
              </label>

              <div class="input-group">

                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>

                <input
                  id="password"
                  [type]="
                    mostrarPassword
                      ? 'text'
                      : 'password'
                  "
                  class="form-control"
                  formControlName="password"
                  placeholder="Contraseña"
                  autocomplete="current-password"
                >

                <button
                  type="button"
                  class="btn btn-outline-secondary password-toggle"
                  (click)="alternarPassword()"
                  [attr.aria-label]="
                    mostrarPassword
                      ? 'Ocultar contraseña'
                      : 'Mostrar contraseña'
                  "
                >

                  <i
                    class="bi"
                    [ngClass]="
                      mostrarPassword
                        ? 'bi-eye-slash'
                        : 'bi-eye'
                    "
                  ></i>

                </button>

              </div>

              <div
                *ngIf="
                  formulario.controls.password.touched &&
                  formulario.controls.password.invalid
                "
                class="text-danger small mt-1"
              >
                La contraseña es obligatoria.
              </div>

            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2"
              [disabled]="cargando"
            >

              <span
                *ngIf="cargando"
                class="spinner-border spinner-border-sm me-2"
              ></span>

              <i
                *ngIf="!cargando"
                class="bi bi-box-arrow-in-right me-2"
              ></i>

              {{ cargando ? 'Ingresando...' : 'Ingresar' }}

            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
