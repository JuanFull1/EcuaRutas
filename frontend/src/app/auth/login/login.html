<div
  class="login-page d-flex align-items-center justify-content-center"
>

  <div class="container">

    <div
      class="row g-0 login-container shadow-lg mx-auto"
    >

      <div
        class="col-lg-6 d-none d-lg-flex login-brand"
      >

        <div>

          <div class="brand-icon mb-4">
            <i class="bi bi-bus-front-fill"></i>
          </div>

          <h1 class="fw-bold mb-3">
            EcuaRutas
          </h1>

          <p class="lead mb-0">
            Gestión y venta de pasajes de
            transporte interprovincial.
          </p>

        </div>

      </div>

      <div class="col-12 col-lg-6 bg-white">

        <div class="login-form">

          <div class="d-lg-none text-center mb-4">

            <div
              class="brand-icon mobile mx-auto mb-2"
            >
              <i class="bi bi-bus-front-fill"></i>
            </div>

            <h2 class="fw-bold">
              EcuaRutas
            </h2>

          </div>

          <h2 class="fw-bold mb-2">
            Iniciar sesión
          </h2>

          <p class="text-secondary mb-4">
            Ingresa tus credenciales para continuar.
          </p>

          <div
            *ngIf="error"
            class="alert alert-danger"
          >
            <i
              class="bi bi-exclamation-circle me-2"
            ></i>

            {{ error }}
          </div>

          <form
            [formGroup]="formulario"
            (ngSubmit)="iniciarSesion()"
          >

            <div class="mb-3">

              <label
                for="correo"
                class="form-label fw-semibold"
              >
                Correo electrónico
              </label>

              <div class="input-group">

                <span class="input-group-text">
                  <i class="bi bi-envelope"></i>
                </span>

                <input
                  id="correo"
                  type="email"
                  class="form-control"
                  formControlName="correo"
                  placeholder="usuario@ecuarutas.com"
                >

              </div>

              <div
                *ngIf="
                  formulario.controls.correo.touched &&
                  formulario.controls.correo.invalid
                "
                class="text-danger small mt-1"
              >
                Ingresa un correo válido.
              </div>

            </div>

            <div class="mb-4">

              <label
                for="password"
                class="form-label fw-semibold"
              >
                Contraseña
              </label>

              <div class="input-group">

                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>

                <input
                  id="password"
                  type="password"
                  class="form-control"
                  formControlName="password"
                  placeholder="Contraseña"
                >

              </div>

              <div
                *ngIf="
                  formulario.controls.password.touched &&
                  formulario.controls.password.invalid
                "
                class="text-danger small mt-1"
              >
                La contraseña es obligatoria.
              </div>

            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 py-2"
            >
              <i
                class="bi bi-box-arrow-in-right me-2"
              ></i>

              Ingresar
            </button>

          </form>

          <div
            class="alert alert-light border mt-4 mb-0"
          >

            <strong class="d-block mb-1">
              Usuario temporal
            </strong>

            <small class="d-block">
              admin@ecuarutas.local
            </small>

            <small>
              Admin123*
            </small>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
