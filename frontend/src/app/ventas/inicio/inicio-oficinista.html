<div class="container-fluid px-0">

  <section
    class="bg-white border rounded-4 p-4 mb-4"
  >

    <span
      class="badge text-bg-success mb-3"
    >
      Oficinista
    </span>

    <h1 class="h3 fw-bold">
      Panel de Ventas
    </h1>

    <p class="text-secondary mb-0">
      Gestión de ventas, boletos,
      pagos y validaciones.
    </p>

  </section>

  <div class="row g-3">

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <span class="text-secondary">
            Ventas
          </span>

          <i
            class="bi bi-cart fs-4 text-success float-end"
          ></i>

          <h2 class="fw-bold mt-3 mb-1">
            -
          </h2>

          <small class="text-secondary">
            Ventas realizadas
          </small>

        </div>

      </div>

    </div>

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <span class="text-secondary">
            Boletos
          </span>

          <i
            class="bi bi-ticket-perforated fs-4 text-primary float-end"
          ></i>

          <h2 class="fw-bold mt-3 mb-1">
            -
          </h2>

          <small class="text-secondary">
            Boletos procesados
          </small>

        </div>

      </div>

    </div>

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">

        <div class="card-body">

          <span class="text-secondary">
            Pagos
          </span>

          <i
            class="bi bi-credit-card fs-4 text-warning float-end"
          ></i>

          <h2 class="fw-bold mt-3 mb-1">
            -
          </h2>

          <small class="text-secondary">
            Pagos registrados
          </small>

        </div>

      </div>

    </div>

  </div>

</div>
