<div class="container-fluid px-0">

  <section
    class="bg-white border rounded-4 p-4 mb-4"
  >

    <span
      class="badge text-bg-info mb-3"
    >
      Cliente
    </span>

    <h1 class="h3 fw-bold">
      Mis viajes
    </h1>

    <p class="text-secondary mb-0">
      Busca destinos, compra boletos
      y consulta tus viajes.
    </p>

  </section>

  <div class="row g-3">

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">

          <span class="text-secondary">
            Próximos viajes
          </span>

          <i
            class="bi bi-bus-front fs-4 text-primary float-end"
          ></i>

          <h2 class="fw-bold mt-3 mb-1">
            -
          </h2>

          <small class="text-secondary">
            Viajes programados
          </small>

        </div>
      </div>

    </div>

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">

          <span class="text-secondary">
            Mis boletos
          </span>

          <i
            class="bi bi-ticket-perforated fs-4 text-success float-end"
          ></i>

          <h2 class="fw-bold mt-3 mb-1">
            -
          </h2>

          <small class="text-secondary">
            Boletos adquiridos
          </small>

        </div>
      </div>

    </div>

    <div class="col-12 col-sm-6 col-xl-3">

      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">

          <span class="text-secondary">
            Notificaciones
          </span>

          <i
            class="bi bi-bell fs-4 text-warning float-end"
          ></i>

          <h2 class="fw-bold mt-3 mb-1">
            -
          </h2>

          <small class="text-secondary">
            Notificaciones pendientes
          </small>

        </div>
      </div>

    </div>

  </div>

</div>
